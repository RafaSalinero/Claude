# Copia main en gh-pages en cada push, para que GitHub Pages publique siempre lo último.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copiar main en gh-pages
        run: git push --force origin HEAD:gh-pages
